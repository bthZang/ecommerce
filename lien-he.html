<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Liên hệ | Boost Green Niva</title>
  <meta name="description" content="Liên hệ Boost Green Niva để được tư vấn sản phẩm và kỹ thuật chăm sóc cây trồng. Hotline, Zalo, email và địa chỉ." />
  <link rel="icon" href="/assets/images/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/css/style.css" />
</head>
<body data-page="lien-he">
  <div id="site-header"></div>

  <main>
    <section class="page-banner">
      <div class="container">
        <h1>Liên hệ tư vấn</h1>
        <p>Chúng tôi luôn sẵn sàng hỗ trợ bà con nhà vườn</p>
        <div class="breadcrumb"><a href="/">Trang chủ</a> / Liên hệ</div>
      </div>
    </section>

    <section class="section">
      <div class="container contact-grid">
        <div class="contact-list">
          <a class="contact-item" data-link="tel">
            <span class="contact-icon">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.6a1 1 0 0 1-.25 1z"/></svg>
            </span>
            <div>
              <small>Hotline</small>
              <strong data-site="hotline"></strong>
            </div>
          </a>
          <a class="contact-item" data-link="zalo" target="_blank" rel="noopener">
            <span class="contact-icon">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3C6.5 3 2 6.6 2 11c0 2.4 1.3 4.6 3.4 6.1L4.5 21l4.2-2.3c1 .2 2.1.3 3.3.3 5.5 0 10-3.6 10-8s-4.5-8-10-8z"/></svg>
            </span>
            <div>
              <small>Zalo liên hệ</small>
              <strong data-site="hotline"></strong>
            </div>
          </a>
          <a class="contact-item" data-link="email">
            <span class="contact-icon">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm0 4-8 5-8-5V6l8 5 8-5z"/></svg>
            </span>
            <div>
              <small>Email</small>
              <strong data-site="email"></strong>
            </div>
          </a>
          <a class="contact-item" data-link="map" target="_blank" rel="noopener">
            <span class="contact-icon">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a7 7 0 0 0-7 7c0 5.25 7 13 7 13s7-7.75 7-13a7 7 0 0 0-7-7zm0 9.5a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5z"/></svg>
            </span>
            <div>
              <small>Địa chỉ</small>
              <strong data-site="address"></strong>
            </div>
          </a>
        </div>

        <div class="map">
          <iframe data-map-embed title="Bản đồ địa chỉ Boost Green Niva" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
        </div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>
  <script src="/assets/js/main.js"></script>
</body>
</html>
